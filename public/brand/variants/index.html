</style></head><body><h1>Trioga — logo options</h1><p class="lead">10 lockups using the new wide TRIOGA lettering. Each has an SVG (infinitely sharp), a PNG and a transparent PNG.</p><main><figure><img src="01-classic-horizontal.svg" alt="Classic horizontal" loading="lazy"><figcaption><b>1. Classic horizontal</b><span>Current mark beside the wordmark. Best for the website header.</span><nav><a href="01-classic-horizontal.svg" download>SVG</a><a href="01-classic-horizontal.png" download>PNG</a><a href="01-classic-horizontal-transparent.png" download>PNG (transparent)</a></nav></figcaption></figure><figure><img src="02-stacked.svg" alt="Stacked" loading="lazy"><figcaption><b>2. Stacked</b><span>Mark centred above the wordmark, like your reference. Great for social avatars and pitch decks.</span><nav><a href="02-stacked.svg" download>SVG</a><a href="02-stacked.png" download>PNG</a><a href="02-stacked-transparent.png" download>PNG (transparent)</a></nav></figcaption></figure><figure><img src="03-app-badge.svg" alt="App badge" loading="lazy"><figcaption><b>3. App badge</b><span>White mark on a gradient tile. Doubles as the app/favicon icon.</span><nav><a href="03-app-badge.svg" download>SVG</a><a href="03-app-badge.png" download>PNG</a><a href="03-app-badge-transparent.png" download>PNG (transparent)</a></nav></figcaption></figure><figure><img src="04-tricolor-tagline.svg" alt="Tri-colour + tagline" loading="lazy"><figcaption><b>4. Tri-colour + tagline</b><span>Each stroke its own colour — one per discipline (web, mobile, software). Tagline justified to the wordmark.</span><nav><a href="04-tricolor-tagline.svg" download>SVG</a><a href="04-tricolor-tagline.png" download>PNG</a><a href="04-tricolor-tagline-transparent.png" download>PNG (transparent)</a></nav></figcaption></figure><figure><img src="05-sharp-bold.svg" alt="Sharp bold" loading="lazy"><figcaption><b>5. Sharp bold</b><span>Heavier mark with square ends and sharp corners — matches the wordmark's geometry exactly.</span><nav><a href="05-sharp-bold.svg" download>SVG</a><a href="05-sharp-bold.png" download>PNG</a><a href="05-sharp-bold-transparent.png" download>PNG (transparent)</a></nav></figcaption></figure><figure><img src="06-integrated-a.svg" alt="Integrated A" loading="lazy"><figcaption><b>6. Integrated A</b><span>The mark replaces the A. Compact, memorable, works as a single-line logo.</span><nav><a href="06-integrated-a.svg" download>SVG</a><a href="06-integrated-a.png" download>PNG</a><a href="06-integrated-a-transparent.png" download>PNG (transparent)</a></nav></figcaption></figure><figure><img src="07-integrated-o.svg" alt="Integrated O" loading="lazy"><figcaption><b>7. Integrated O</b><span>The mark sits in the heart of the name — TRI·GA. Bold, distinctive signature.</span><nav><a href="07-integrated-o.svg" download>SVG</a><a href="07-integrated-o.png" download>PNG</a><a href="07-integrated-o-transparent.png" download>PNG (transparent)</a></nav></figcaption></figure><figure><img src="08-gradient-wordmark.svg" alt="Gradient wordmark" loading="lazy"><figcaption><b>8. Gradient wordmark</b><span>Outline mark in white, colour moved into the letters. Premium, editorial feel.</span><nav><a href="08-gradient-wordmark.svg" download>SVG</a><a href="08-gradient-wordmark.png" download>PNG</a><a href="08-gradient-wordmark-transparent.png" download>PNG (transparent)</a></nav></figcaption></figure><figure><img src="09-mono-light.svg" alt="Monochrome (light)" loading="lazy"><figcaption><b>9. Monochrome (light)</b><span>Single-colour ink on white — for documents, invoices, print and embossing.</span><nav><a href="09-mono-light.svg" download>SVG</a><a href="09-mono-light.png" download>PNG</a><a href="09-mono-light-transparent.png" download>PNG (transparent)</a></nav></figcaption></figure><figure><img src="10-folded-t.svg" alt="Folded T (new mark)" loading="lazy"><figcaption><b>10. Folded T (new mark)</b><span>New mark inspired by your reference: three folded ribbons forming a T. Stacked with the wordmark.</span><nav><a href="10-folded-t.svg" download>SVG</a><a href="10-folded-t.png" download>PNG</a><a href="10-folded-t-transparent.png" download>PNG (transparent)</a></nav></figcaption></figure></main></body></html>
